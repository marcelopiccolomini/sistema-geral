<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Processos</title>
    <link rel="icon" href="/static/management.ico" type="image/x-icon">
    <!-- Link para o CSS do Bootstrap -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='stylesHome.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">Menu<span style="color: #0d6efd;">Principal</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="nav navbar-nav ms-auto">
                    {% if session['username'] %}
                        <!-- Mensagem de boas-vindas -->
                        <li class="nav-item welcome-message">
                            <i class="fas fa-user" style="margin: 5px;"></i><span> Bem-vindo, {{ session['username'] }}!</span>
                        </li>
                        <!-- Link para trocar senha -->
                        <li class="nav-item welcome-message">
                            <a class="nav-link" href="{{ url_for('change_password') }}">
                                <i class="fas fa-key" style="color: rgb(226, 226, 75);"></i> Trocar Senha
                            </a>
                        </li>
                        <!-- Botão de Logout -->
                        <li class="nav-item welcome-message">
                            <a class="nav-link active" href="{{ url_for('logoff') }}">
                                <i class="fas fa-sign-out-alt"></i> Sair
                            </a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Gerenciador de Processos</h1>

        <div class="text-center mb-4">
            <button class="btn btn-primary btn-lg m-2" onclick="openModal('Vencidos')">Executar: Vencidos</button>
            <button class="btn btn-success btn-lg m-2" onclick="openModal1('Verba para Ações')">Executar: Verba para Ações</button>
            <button class="btn btn-warning btn-lg m-2" onclick="openModal2('Contas Fixas')">Executar: Contas Fixas</button>
        </div>

        <div class="mt-5">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Processo</th>
                        <th>Status</th>
                        <th>Dia e Hora de Início</th>
                        <th>Tempo de Execução</th>
                    </tr>
                </thead>
                <tbody id="statusTable">
                    <!-- As linhas serão adicionadas dinamicamente -->
                </tbody>
            </table>
        </div>

    <!-- Modal -->
    <div class="modal fade" id="processModal" tabindex="-1" aria-labelledby="processModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="processModalLabel">Parâmetros do Processo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="processForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="executionDate" class="form-label">Dia de Execução</label>
                            <input type="date" class="form-control" id="executionDate" required>
                            <input type="file" class="form-control" id="fileInput1" name="file" multiple accept=".bbt" required>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Confirmar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadModalLabel">Upload de Arquivo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="fileInput" class="form-label"> Escolha um arquivo de Contas à Pagar:</label>
                            <input type="file" class="form-control" id="fileInput" name="file" accept=".xlsx, .xls" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="ContasFxModal" tabindex="-1" aria-labelledby="ContasFxModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ContasFxModalLabel">Selecionar Período</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="monthSelectionForm">
                        <div class="mb-3">
                            <label for="mesStart" class="form-label">Mês Inicial:</label>
                            <select class="form-control" id="mesStart" name="mesStart" required>
                                <option value="" disabled selected>Selecione o mês</option>
                                <option value="01">Janeiro</option>
                                <option value="02">Fevereiro</option>
                                <option value="03">Março</option>
                                <option value="04">Abril</option>
                                <option value="05">Maio</option>
                                <option value="06">Junho</option>
                                <option value="07">Julho</option>
                                <option value="08">Agosto</option>
                                <option value="09">Setembro</option>
                                <option value="10">Outubro</option>
                                <option value="11">Novembro</option>
                                <option value="12">Dezembro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="mesEnd" class="form-label">Mês Final:</label>
                            <select class="form-control" id="mesEnd" name="mesEnd" required>
                                <option value="" disabled selected>Selecione o mês</option>
                                <option value="01">Janeiro</option>
                                <option value="02">Fevereiro</option>
                                <option value="03">Março</option>
                                <option value="04">Abril</option>
                                <option value="05">Maio</option>
                                <option value="06">Junho</option>
                                <option value="07">Julho</option>
                                <option value="08">Agosto</option>
                                <option value="09">Setembro</option>
                                <option value="10">Outubro</option>
                                <option value="11">Novembro</option>
                                <option value="12">Dezembro</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Confirmar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Link para o JS do Bootstrap e o script principal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentProcess = "";

function openModal(processName) {
    currentProcess = processName;
    const modal = new bootstrap.Modal(document.getElementById('processModal'));
    modal.show();
}

document.getElementById('processForm').addEventListener('submit', function (event) {
    event.preventDefault();
    const executionDate = document.getElementById('executionDate').value;
    
    if (!executionDate) {
        alert("Por favor, insira uma data de execução.");
        return;
    }

    const fileInput = document.getElementById('fileInput1');
    if (!fileInput.files || fileInput.files.length === 0) {
        alert("Por favor, selecione pelo menos um arquivo.");
        return;
    }

    const modal = bootstrap.Modal.getInstance(document.getElementById('processModal'));
    modal.hide();

    // Inicia o processo com os parâmetros do modal
    startProcess(currentProcess, executionDate, fileInput, null, null);
});

function openModal1(processName) {
    currentProcess = processName;
    const modal1 = new bootstrap.Modal(document.getElementById('uploadModal'));
    modal1.show();
}

document.getElementById('uploadForm').addEventListener('submit', function (event) {
    event.preventDefault();
    const fileInput = document.getElementById('fileInput');

    if (!fileInput.files || fileInput.files.length === 0) {
        alert("Por favor, selecione um arquivo.");
        return;
    }

    const modal1 = bootstrap.Modal.getInstance(document.getElementById('uploadModal'));
    modal1.hide();

    // Inicia o processo sem `executionDate`, pois não é necessário
    startProcess(currentProcess, null, fileInput, null, null);
});

function openModal2(processName) {
    currentProcess = processName;
    const modal2 = new bootstrap.Modal(document.getElementById('ContasFxModal'));
    modal2.show();
}

document.getElementById('monthSelectionForm').addEventListener('submit', function (event) {
    event.preventDefault();
    const mesStart = document.getElementById('mesStart').value;
    const mesEnd = document.getElementById('mesEnd').value;

    if (!mesStart || !mesEnd) {
        alert("Por favor, selecione os meses corretamente.");
        return;
    }

    const modal2 = bootstrap.Modal.getInstance(document.getElementById('ContasFxModal'));
    modal2.hide();

    // Inicia o processo sem `fileInput`, pois não é necessário
    startProcess(currentProcess, null, null, mesStart, mesEnd);
});

function startProcess(processName, executionDate = null, fileInput = null, mesStart = null, mesEnd = null) {
    const table = document.getElementById('statusTable');
    const newRow = table.insertRow();
    const processCell = newRow.insertCell(0);
    const statusCell = newRow.insertCell(1);
    const startTimeCell = newRow.insertCell(2);
    const durationCell = newRow.insertCell(3);

    const startTime = new Date();
    const startTimeFormatted = startTime.toLocaleString();

    processCell.textContent = processName;
    statusCell.textContent = "Executando";
    statusCell.className = "text-warning";
    startTimeCell.textContent = startTimeFormatted;
    durationCell.textContent = "Calculando...";

    const formData = new FormData();
    formData.append('process', processName);

    if (executionDate) {
        formData.append('executionDate', executionDate);
    }

    if (fileInput && fileInput.files.length > 0) {
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append('file', fileInput.files[i]);
        }
    }

    if (mesStart && mesEnd) {
        formData.append('mesStart', mesStart);
        formData.append('mesEnd', mesEnd);
    }

    fetch('/start', {
        method: 'POST',
        body: formData,
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`Erro na resposta do servidor: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        statusCell.textContent = data.status;
        statusCell.className = data.status.includes("Concluído") ? "text-success" : "text-danger";

        const endTime = new Date();
        const duration = ((endTime - startTime) / 1000).toFixed(2);
        durationCell.textContent = `${duration} segundos`;
    })
    .catch(error => {
        statusCell.textContent = "Erro";
        statusCell.className = "text-danger";
        durationCell.textContent = "Falha ao calcular";
        console.error('Erro ao iniciar o processo:', error);
    });
}

        
    </script>
</body>
</html>
