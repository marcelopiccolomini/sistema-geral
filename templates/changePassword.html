<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Senha</title>
    <link rel="icon" href="/static/password-login.ico" type="image/x-icon">
    <!-- Link para o CSS do Bootstrap -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='stylesHome.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='changePass.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">Menu<span style="color: #0d6efd;">Principal</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="nav navbar-nav ms-auto">
                    {% if session['username'] %}
                        <!-- Mensagem de boas-vindas -->
                        <li class="nav-item welcome-message">
                            <i class="fas fa-user" style="margin: 5px;"></i><span> Bem-vindo, {{ session['username'] }}!</span>
                        </li>
                        <!-- Link para trocar senha -->
                        <li class="nav-item welcome-message">
                            <a class="nav-link" href="{{ url_for('change_password') }}">
                                <i class="fas fa-key" style="color: rgb(226, 226, 75);"></i> Trocar Senha
                            </a>
                        </li>
                        <!-- Botão de Logout -->
                        <li class="nav-item welcome-message">
                            <a class="nav-link active" href="{{ url_for('logoff') }}">
                                <i class="fas fa-sign-out-alt"></i> Sair
                            </a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
<div class="mainDiv">
    <div class="cardStyle">
        
      <form action="{{ url_for('change_password') }}" method="POST" name="signupForm" id="signupForm">
        
        <img src="" id="signupLogo"/>
        
        <h2 class="formTitle">
          Troca de Senha
        </h2>
        
        <div class="inputDiv">
            <label class="inputLabel" for="password">Nova Senha</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" required>
                <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
            </div>
        </div>
        
        <div class="inputDiv">
            <label class="inputLabel" for="confirmPassword">Confirmar Senha</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" name="confirmPassword">
                <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
            </div>
        </div>
      
      <div class="buttonWrapper">
        <button type="submit" id="submitButton" onclick="validateSignupForm()" class="submitButton pure-button pure-button-primary">
          <span>Confirmar</span>
          <span id="loader"></span>
        </button>
      </div>
        
    </form>
    </div>
  </div>
  <script src="{{ url_for('static', filename='changePass.js') }}"></script>
</body>
</html>
