<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="/static/login.ico" type="image/x-icon">
    <title>Login - Sistema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="{{ url_for('static', filename='login.css') }}" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <h2>Entrar</h2>

        <!-- Mensagens de alerta -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="input-field">
                <input type="text" id="usuario" name="username" required placeholder="Usuário">
            </div>
            <div class="input-field">
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required placeholder="Senha">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
                </div>
            </div>
            <button type="submit" class="btn">Entrar</button>
            <a href="#" class="forgot-password">Esqueceu sua senha?</a>
        </form>
    </div>
    <script src="{{ url_for('static', filename='changePass.js') }}"></script>
</body>
</html>
